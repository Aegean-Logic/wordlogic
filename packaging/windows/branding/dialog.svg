<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="493" height="312" viewBox="0 0 493 312">
  <!-- The Windows installer's welcome and finish background (WixUIDialogBmp: 493 x 312 px; WiX
       draws the page's text in black from x = 180 px). Aegean Logic palette: an ink-to-sea panel
       on the left with the brand kit's reversed lockup (referenced, not copied), "WordLogic" in
       marble and one aqua accent; white behind the text. generate.ps1 renders this to dialog.bmp. -->
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A2A3B"/>
      <stop offset="0.6" stop-color="#0E4A62"/>
      <stop offset="1" stop-color="#12718C"/>
    </linearGradient>
  </defs>
  <rect width="493" height="312" fill="#FFFFFF"/>
  <rect width="164" height="312" fill="url(#sea)"/>
  <rect x="164" width="3" height="312" fill="#2FC6C0"/>
  <image x="16" y="22" width="132" height="55" xlink:href="../../../docs/brand/aegean-logic-lockup-dark.svg" preserveAspectRatio="xMinYMid meet"/>
  <text x="18" y="252" font-family="Segoe UI Semibold, Segoe UI, sans-serif" font-weight="600" font-size="26" fill="#F4F2EC">WordLogic</text>
  <text x="19" y="276" font-family="Segoe UI, sans-serif" font-size="13" fill="#2FC6C0">Setup</text>
</svg>
